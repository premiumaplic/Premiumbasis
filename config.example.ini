; ============================================================
;  Настройки SchoolBot. Этот файл НЕ попадает в GitHub.
;  Здесь хранятся секреты — никому не пересылайте этот файл.
;  После изменения сохраните файл (Ctrl+S) и перезапустите бота.
; ============================================================

[telegram]
; Токен бота: получите у @BotFather (команда /newbot), вставьте целиком
token =

; Ваш Telegram ID (только цифры). Не знаете? Напишите боту /myid
owner_id =

; ID закрытого канала для бэкапов, например -1001234567890 (понадобится на этапе 4)
backup_channel_id =

[forms]
; Адрес форм на GitHub Pages. Обычно менять не нужно.
base_url = https://premiumaplic.github.io/Premiumbasis/

[backup]
; Пароль для шифрования бэкапов (этап 4). Придумайте длинный и запишите на бумаге:
; без него бэкап не открыть.
password =

[probe]
; Только для этапа 0: Telegram ID учителей, которые помогут проверить
; формы на своих телефонах (через запятую). Можно оставить пустым.
testers =
